name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Refresca las vistas previas de enlaces aunque no haya cambios de código:
    # así los lanzamientos nuevos también se comparten con foto y descripción.
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar vistas previas de enlaces
        # Escribe m-<clave>.html y p-<nombre>.html con los metadatos Open Graph
        # de cada lanzamiento y de cada propulsor.
        continue-on-error: true
        env:
          JSA_SITE_BASE: https://jsaerospace.github.io/GeoNet-JSAerospace/
        run: python3 tools/build-share.py

      - name: Preparar sitio estático
        run: |
          set -euo pipefail
          test -f index.html || { echo "Falta index.html en la raíz"; exit 1; }
          mkdir -p _site
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.freebuff' \
            --exclude='tools' \
            --exclude='screenshots' \
            --exclude='_site' \
            ./ _site/
          echo "Páginas de vista previa: $(find _site -maxdepth 1 -name 'm-*.html' -o -maxdepth 1 -name 'p-*.html' | wc -l)"
          echo "Archivos publicados: $(find _site -type f | wc -l)"

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
