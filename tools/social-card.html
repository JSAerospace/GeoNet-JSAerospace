<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Tarjeta social · J.S. Aerospace</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background: #05070b;
            font-family: 'Space Grotesk', 'Poppins', sans-serif;
        }

        .card {
            position: relative;
            width: 1200px;
            height: 630px;
            overflow: hidden;
            background:
                radial-gradient(1100px 520px at 78% 46%, rgba(0, 240, 255, 0.22), transparent 62%),
                radial-gradient(760px 420px at 8% 96%, rgba(255, 0, 212, 0.16), transparent 60%),
                linear-gradient(150deg, #05070b 0%, #080c14 52%, #04060a 100%);
        }

        .grid {
            position: absolute;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(900px 520px at 55% 45%, #000 30%, transparent 78%);
        }

        .glow {
            position: absolute;
            width: 620px;
            height: 620px;
            right: -110px;
            top: 5px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.28), transparent 62%);
            filter: blur(6px);
        }

        .rocket {
            position: absolute;
            right: 0;
            top: 0;
            width: 690px;
            height: 630px;
            object-fit: cover;
            object-position: 58% 42%;
            filter: saturate(1.06) contrast(1.02) brightness(0.72);
            -webkit-mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.55) 26%, #000 52%);
            mask-image: linear-gradient(90deg, transparent 0%, rgba(0, 0, 0, 0.55) 26%, #000 52%);
        }

        .wash {
            position: absolute;
            right: 0;
            top: 0;
            width: 700px;
            height: 630px;
            background:
                linear-gradient(90deg, rgba(5, 7, 11, 0.97) 0%, rgba(5, 7, 11, 0.42) 46%, rgba(5, 7, 11, 0.10) 100%),
                linear-gradient(180deg, rgba(5, 7, 11, 0.78) 0%, rgba(5, 7, 11, 0.16) 34%, transparent 64%),
                linear-gradient(0deg, rgba(5, 7, 11, 0.6) 0%, transparent 44%);
        }

        .content {
            position: relative;
            z-index: 3;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.35);
            height: 100%;
            padding: 54px 70px 48px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .brand { display: flex; align-items: center; gap: 16px; }

        .brand img { width: 60px; height: 60px; object-fit: contain; }

        .brand-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            letter-spacing: 0.24em;
            text-transform: uppercase;
            color: #f2f5f8;
        }

        .brand-text span { color: #00f0ff; }

        h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 800;
            font-size: 62px;
            line-height: 1.02;
            letter-spacing: -0.02em;
            color: #f2f5f8;
            max-width: 600px;
            margin-top: 26px;
            text-shadow: 0 2px 26px rgba(0, 0, 0, 0.45);
        }

        h1 em {
            font-style: normal;
            color: #00f0ff;
        }

        .sub {
            margin-top: 22px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 23px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(242, 245, 248, 0.62);
        }

        .rule {
            width: 110px;
            height: 3px;
            margin-top: 26px;
            background: linear-gradient(90deg, #00f0ff, rgba(255, 0, 212, 0.7));
        }

        .foot {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: 'Rajdhani', sans-serif;
            font-size: 18px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: rgba(242, 245, 248, 0.45);
        }

        .tag {
            padding: 8px 16px;
            border: 1px solid rgba(0, 240, 255, 0.45);
            border-radius: 999px;
            color: #00f0ff;
            font-size: 15px;
            letter-spacing: 0.2em;
        }
    </style>
</head>

<body>
    <div class="card">
        <img class="rocket" src="../Imagenes/Tomcat%204.png" alt="">
        <div class="wash"></div>
        <div class="grid"></div>
        <div class="glow"></div>
        <div class="content">
            <div>
                <div class="brand">
                    <img src="../LOGO_JTT.png" alt="J.S. Aerospace">
                    <div class="brand-text">J.S.<span>AEROSPACE</span></div>
                </div>
                <h1>Lanzadores reutilizables <em>y conectividad orbital</em></h1>
                <div class="rule"></div>
                <p class="sub">Tomcat · GeoNet · Manifiesto de lanzamientos</p>
            </div>
            <div class="foot">
                <span>jsaerospace.github.io</span>
                <span class="tag">KSP · Programa espacial</span>
            </div>
        </div>
    </div>
</body>

</html>
